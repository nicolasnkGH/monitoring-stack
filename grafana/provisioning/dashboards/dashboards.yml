apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'Homelab'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      files:
        - homelab-system.json
        - infrastructure-overview.json
        - gpu-monitoring.json
        - aiops-engine.json
        - ai-infrastructure-monitoring.json
        - per-node-detail.json
      foldersFromFilesStructure: false
