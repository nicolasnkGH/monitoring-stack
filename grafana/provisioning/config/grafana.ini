[server]
domain = grafana.${DOMAIN}
root_url = https://grafana.${DOMAIN}/

[security]
admin_user = admin
admin_password = ${GRAF...RD}

[auth]
disable_login_form = false

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info
